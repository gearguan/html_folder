
<style>

.sec{font-size:11px;font-weight:500;color:var(--color-text-secondary);margin:1rem 0 5px;text-transform:uppercase;letter-spacing:.06em}
.panel{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:14px 16px;margin-top:.5rem}
.panel-title{font-size:15px;font-weight:500;color:var(--color-text-primary);margin-bottom:2px}
.panel-formula{font-size:11px;color:var(--color-text-secondary);font-family:var(--font-mono);margin-bottom:12px;line-height:1.6}
.sliders{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:14px}
.slider-row{display:flex;flex-direction:column;gap:4px}

<h2 class="sr-only">统计分布探索器</h2>
<div style="padding:1rem 0">
<div class="sec">选择分布</div>
<div class="grid" id="cardGrid"></div>
<div class="panel">
  <div class="panel-title" id="pName">请点击上方选择一种分布</div>
  <div class="panel-formula" id="pFormula"></div>
  <div class="sliders" id="sliderArea"></div>
  <div class="stat-row" id="statRow"></div>
  <div class="axis-info" id="axisInfo"></div>
  <div style="position:relative;width:100%;height:240px">
    <canvas id="mainChart" role="img" aria-label="分布曲线"></canvas>
  </div>
  <div class="note" id="pNote"></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
// ── t 分布：数值积分预算归一化常数，完全绕开 lgamma ─────────────
// kernel(x, nu) = (1 + x²/nu)^(-(nu+1)/2)  (未归一化)
// 用梯形法在 [-50, 50] 积分，N=4000 步，对 nu=1..30 各算一次
const T_NORM = new Array(31);
(function(){
  const N = 4000, LO = -50, HI = 50, DX = (HI - LO) / N;
  for(let nu = 1; nu <= 30; nu++){
    let Z = 0;
    for(let i = 0; i <= N; i++){
      const x = LO + i * DX;
      const w = (i === 0 || i === N) ? 0.5 : 1;
      Z += w * Math.pow(1 + x*x/nu, -(nu+1)/2);
    }
    T_NORM[nu] = Z * DX;
  }
})();

// ── 其他数学工具 ─────────────────────────────────────────────
function lgamma(x){
  // g=7 Lanczos（用于非 t 分布的计算）
  const C=[0.99999999999980993,676.5203681218851,-1259.1392167224028,
            771.32342877765313,-176.61502916214059,12.507343278686905,
            -0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(x<0.5) return Math.log(Math.PI/Math.sin(Math.PI*x))-lgamma(1-x);
  x-=1;
  let a=C[0];
  const t=x+7.5;
  for(let i=1;i<9;i++) a+=C[i]/(x+i);
  return 0.5*Math.log(2*Math.PI)+(x+0.5)*Math.log(t)-t+Math.log(a);
}
function lnBeta(a,b){return lgamma(a)+lgamma(b)-lgamma(a+b);}
function comb(n,k){if(k<0||k>n)return 0;let c=1;for(let i=0;i<k;i++)c*=(n-i)/(i+1);return c;}
const gauss=(x,mu,si)=>Math.exp(-0.5*((x-mu)/si)**2)/(si*Math.sqrt(2*Math.PI));

const DS=[
  {id:'norm',name:'正态分布',cat:'对称',c:'#378ADD',
   formula:'f(x) = 1/(σ√2π) · exp(−(x−μ)² / 2σ²)',
   note:'拖动 μ：曲线整体左右平移。拖动 σ：σ 小时曲线高而窄，σ 大时矮而宽。',
   axis:[-12,12,2.1],
   params:[{name:'μ（均值）',key:'mu',min:-5,max:5,step:0.1,def:0},
           {name:'σ（标准差）',key:'si',min:0.2,max:4,step:0.1,def:1}],
   stats:p=>[{l:'均值',v:p.mu.toFixed(2)},{l:'标准差',v:p.si.toFixed(2)},{l:'方差',v:(p.si**2).toFixed(3)},{l:'偏度',v:'0'},{l:'峰度',v:'0'}],
   fn:(x,p)=>gauss(x,p.mu,p.si),
   tfn:x=>gauss(x,0,1),tr:[-3.5,3.5]},

  {id:'lap',name:'拉普拉斯',cat:'对称',c:'#534AB7',
   formula:'f(x) = 1/(2b) · exp(−|x−μ| / b)',
   note:'b 越小峰越尖、尾部越重；b 越大曲线越平坦。',
   axis:[-12,12,2.6],
   params:[{name:'μ（位置）',key:'mu',min:-5,max:5,step:0.1,def:0},
           {name:'b（尺度）',key:'b',min:0.2,max:4,step:0.1,def:1}],
   stats:p=>[{l:'均值',v:p.mu.toFixed(2)},{l:'方差',v:(2*p.b**2).toFixed(3)},{l:'峰度（超额）',v:'3'}],
   fn:(x,p)=>Math.exp(-Math.abs(x-p.mu)/p.b)/(2*p.b),
   tfn:x=>0.5*Math.exp(-Math.abs(x)),tr:[-4,4]},

  // t 分布：fn 用数值归一化常数表，完全不依赖 lgamma
  {id:'t',name:'t 分布',cat:'对称',c:'#0F6E56',
   formula:'f(x) = kernel(x,ν) / Z(ν)，kernel = (1+x²/ν)^(−(ν+1)/2)',
   note:'ν=1 时为柯西分布（矮而宽，重尾）；ν 增大峰越高越窄，ν=30 时已接近标准正态。',
   axis:[-6,6,0.42],
   params:[{name:'ν（自由度）',key:'nu',min:1,max:30,step:1,def:5}],
   stats:p=>[
     {l:'ν',v:Math.round(p.nu)},
     {l:'峰值 f(0)',v:(1/T_NORM[Math.round(p.nu)]).toFixed(4)},
     {l:'均值',v:p.nu>1?'0':'未定义'},
     {l:'方差',v:p.nu>2?(p.nu/(p.nu-2)).toFixed(3):'未定义'}
   ],
   fn:(x,p)=>{
     const nu=Math.round(p.nu);
     return Math.pow(1+x*x/nu,-(nu+1)/2) / T_NORM[nu];
   },
   tfn:x=>Math.pow(1+x*x/5,-(5+1)/2)/T_NORM[5],
   tr:[-4,4]},

  {id:'logn',name:'对数正态',cat:'右偏',c:'#BA7517',
   formula:'f(x) = 1/(xσ√2π) · exp(−(lnx−μ)² / 2σ²)',
   note:'μ 使曲线整体缩放，σ 越大右偏程度越强、尾部越重。',
   axis:[0,20,2.5],
   params:[{name:'μ（对数均值）',key:'mu',min:-1,max:2,step:0.1,def:0},
           {name:'σ（对数标准差）',key:'si',min:0.1,max:1.2,step:0.05,def:0.5}],
   stats:p=>[{l:'均值',v:Math.exp(p.mu+p.si**2/2).toFixed(3)},{l:'中位数',v:Math.exp(p.mu).toFixed(3)},{l:'众数',v:Math.exp(p.mu-p.si**2).toFixed(3)}],
   fn:(x,p)=>x<=0?0:Math.exp(-0.5*((Math.log(x)-p.mu)/p.si)**2)/(x*p.si*Math.sqrt(2*Math.PI)),
   tfn:x=>x<=0?0:Math.exp(-0.5*((Math.log(x)-0.5)/0.5)**2)/(x*0.5*Math.sqrt(2*Math.PI)),tr:[0.05,8]},

  {id:'gamma',name:'Gamma 分布',cat:'右偏',c:'#D85A30',
   formula:'f(x) = x^(k−1)·e^(−x/θ) / (θ^k·Γ(k))',
   note:'k<1 单调递减，k=1 指数分布，k 增大峰值右移，θ 拉伸横轴尺度。',
   axis:[0,35,1.2],
   params:[{name:'k（形状）',key:'k',min:0.5,max:8,step:0.5,def:2},
           {name:'θ（尺度）',key:'th',min:0.5,max:4,step:0.1,def:1}],
   stats:p=>[{l:'均值',v:(p.k*p.th).toFixed(2)},{l:'方差',v:(p.k*p.th**2).toFixed(3)},{l:'偏度',v:(2/Math.sqrt(p.k)).toFixed(3)}],
   fn:(x,p)=>x<=0?0:Math.exp((p.k-1)*Math.log(x)-x/p.th-p.k*Math.log(p.th)-lgamma(p.k)),
   tfn:x=>x<=0?0:x*Math.exp(-x),tr:[0,8]},

  {id:'exp',name:'指数分布',cat:'右偏',c:'#993C1D',
   formula:'f(x) = λ · exp(−λx)',
   note:'λ 越大衰减越快（均值=1/λ 越小），固定轴可清晰看到斜率变化。',
   axis:[0,12,5.5],
   params:[{name:'λ（速率）',key:'la',min:0.2,max:5,step:0.1,def:1}],
   stats:p=>[{l:'均值',v:(1/p.la).toFixed(3)},{l:'方差',v:(1/p.la**2).toFixed(3)},{l:'偏度',v:'2'},{l:'峰度（超额）',v:'6'}],
   fn:(x,p)=>x<0?0:p.la*Math.exp(-p.la*x),
   tfn:x=>x<0?0:Math.exp(-x),tr:[0,5]},

  {id:'weib',name:'Weibull',cat:'右偏',c:'#639922',
   formula:'f(x) = (k/λ)(x/λ)^(k−1)·exp(−(x/λ)^k)',
   note:'k<1 单调递减，k=1 指数分布，k>1 出现峰值并右移，k 大时趋近正态。',
   axis:[0,10,2.2],
   params:[{name:'k（形状）',key:'k',min:0.5,max:5,step:0.1,def:2},
           {name:'λ（尺度）',key:'la',min:0.5,max:4,step:0.1,def:2}],
   stats:p=>[{l:'均值',v:(p.la*Math.exp(lgamma(1+1/p.k))).toFixed(3)},{l:'众数',v:p.k>1?(p.la*Math.pow((p.k-1)/p.k,1/p.k)).toFixed(3):'0（k≤1）'}],
   fn:(x,p)=>x<=0?0:(p.k/p.la)*Math.pow(x/p.la,p.k-1)*Math.exp(-Math.pow(x/p.la,p.k)),
   tfn:x=>{if(x<=0)return 0;const k=2,la=2;return(k/la)*Math.pow(x/la,k-1)*Math.exp(-Math.pow(x/la,k));},tr:[0,5]},

  {id:'beta',name:'Beta 分布',cat:'有界',c:'#1D9E75',
   formula:'f(x) = x^(α−1)(1−x)^(β−1) / B(α,β)',
   note:'x 轴天然固定在 [0,1]。α=β=1 均匀分布；α,β<1 U形；不对称时偏向一侧。',
   axis:[0,1,6],
   params:[{name:'α',key:'a',min:0.2,max:8,step:0.1,def:2},
           {name:'β',key:'b',min:0.2,max:8,step:0.1,def:3}],
   stats:p=>[{l:'均值',v:(p.a/(p.a+p.b)).toFixed(3)},{l:'方差',v:(p.a*p.b/((p.a+p.b)**2*(p.a+p.b+1))).toFixed(4)},{l:'众数',v:p.a>1&&p.b>1?((p.a-1)/(p.a+p.b-2)).toFixed(3):'边界'}],
   fn:(x,p)=>(x<=0||x>=1)?0:Math.exp((p.a-1)*Math.log(x)+(p.b-1)*Math.log(1-x)-lnBeta(p.a,p.b)),
   tfn:x=>(x<=0||x>=1)?0:Math.exp(Math.log(x)+2*Math.log(1-x)-lnBeta(2,3)),tr:[0.001,0.999]},

  {id:'gmm',name:'混合高斯',cat:'多峰',c:'#7F77DD',
   formula:'f(x) = π·N(μ₁,σ) + (1−π)·N(μ₂,σ)',
   note:'移动 μ₁/μ₂ 看峰的位置变化，调 π 看两峰此消彼长，调 σ 看峰的宽窄。',
   axis:[-10,10,1.1],
   params:[{name:'μ₁（峰1位置）',key:'mu1',min:-5,max:5,step:0.1,def:-2},
           {name:'μ₂（峰2位置）',key:'mu2',min:-5,max:5,step:0.1,def:2},
           {name:'σ（标准差）',key:'si',min:0.2,max:3,step:0.1,def:1},
           {name:'π（峰1权重）',key:'pi',min:0.05,max:0.95,step:0.05,def:0.5}],
   stats:p=>[{l:'均值',v:(p.pi*p.mu1+(1-p.pi)*p.mu2).toFixed(2)},{l:'峰1权重',v:(p.pi*100).toFixed(0)+'%'},{l:'峰间距',v:Math.abs(p.mu2-p.mu1).toFixed(2)}],
   fn:(x,p)=>p.pi*gauss(x,p.mu1,p.si)+(1-p.pi)*gauss(x,p.mu2,p.si),
   tfn:x=>0.5*gauss(x,-2,1)+0.5*gauss(x,2,1),tr:[-5,5]},

  {id:'pois',name:'泊松分布',cat:'离散',c:'#D4537E',disc:true,
   formula:'P(k) = λ^k · e^(−λ) / k!',
   note:'λ 增大时分布中心右移、峰变宽，可在固定轴上看到整体向右漂移。',
   axis:[0,30,0.65],
   params:[{name:'λ（平均速率）',key:'la',min:0.5,max:15,step:0.5,def:4}],
   stats:p=>[{l:'均值',v:p.la.toFixed(2)},{l:'方差',v:p.la.toFixed(2)},{l:'偏度',v:(1/Math.sqrt(p.la)).toFixed(3)}],
   fn:(x,p)=>{const k=Math.round(x);if(k<0||k>170)return 0;return Math.exp(k*Math.log(p.la)-p.la-lgamma(k+1));},
   tfn:k=>{const la=4;return Math.exp(k*Math.log(la)-la-lgamma(k+1));},tr:[0,12]},

  {id:'binom',name:'二项分布',cat:'离散',c:'#E24B4A',disc:true,
   formula:'P(k) = C(n,k)·p^k·(1−p)^(n−k)',
   note:'增大 n 时分布变宽，改变 p 时分布左右移动，n 大 p 中时趋近正态。',
   axis:[0,30,0.45],
   params:[{name:'n（试验次数）',key:'n',min:2,max:30,step:1,def:10},
           {name:'p（成功概率）',key:'p',min:0.05,max:0.95,step:0.05,def:0.4}],
   stats:p=>[{l:'均值',v:(p.n*p.p).toFixed(2)},{l:'方差',v:(p.n*p.p*(1-p.p)).toFixed(3)},{l:'偏度',v:((1-2*p.p)/Math.sqrt(p.n*p.p*(1-p.p))).toFixed(3)}],
   fn:(x,p)=>{const k=Math.round(x);if(k<0||k>p.n)return 0;return comb(p.n,k)*Math.pow(p.p,k)*Math.pow(1-p.p,p.n-k);},
   tfn:k=>comb(10,k)*Math.pow(0.4,k)*Math.pow(0.6,10-k),tr:[0,10]},
];

// ── Canvas 缩略图 ─────────────────────────────────────────────
function drawThumb(canvas,d){
  const W=canvas.width,H=canvas.height,PAD=2,cw=W-PAD*2,ch=H-PAD*2;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);
  if(d.disc){
    const[lo,hi]=d.tr,ks=[],ys=[];
    for(let k=lo;k<=hi;k++){ks.push(k);const y=d.tfn(k);ys.push(isFinite(y)?y:0);}
    const maxY=Math.max(...ys)||1,n=ks.length,bw=cw/n;
    ctx.fillStyle=d.c+'cc';
    ys.forEach((y,i)=>{
      const bh=(y/maxY)*ch,x=PAD+i*bw+bw*0.1;
      ctx.beginPath();ctx.roundRect(x,PAD+ch-bh,bw*0.8,bh,1);ctx.fill();
    });
  } else {
    const[lo,hi]=d.tr,steps=80,pts=[];
    let maxY=0;
    for(let i=0;i<=steps;i++){const x=lo+(hi-lo)*i/steps,y=d.tfn(x);if(isFinite(y)&&y>maxY)maxY=y;}
    maxY=maxY||1;
    for(let i=0;i<=steps;i++){
      const x=lo+(hi-lo)*i/steps,y=d.tfn(x);
      pts.push([PAD+(i/steps)*cw,PAD+ch-(isFinite(y)?Math.min(y,maxY):0)/maxY*ch]);
    }
    ctx.beginPath();ctx.moveTo(pts[0][0],PAD+ch);
    pts.forEach(([px,py])=>ctx.lineTo(px,py));
    ctx.lineTo(pts[pts.length-1][0],PAD+ch);ctx.closePath();
    ctx.fillStyle=d.c+'28';ctx.fill();
    ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length-1;i++){
      const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;
      ctx.quadraticCurveTo(pts[i][0],pts[i][1],mx,my);
    }
    ctx.lineTo(pts[pts.length-1][0],pts[pts.length-1][1]);
    ctx.strokeStyle=d.c;ctx.lineWidth=1.8;ctx.lineJoin='round';ctx.stroke();
  }
}

// ── 渲染卡片 ─────────────────────────────────────────────────
const catBg={对称:'#E6F1FB',右偏:'#FAEEDA',有界:'#EAF3DE',多峰:'#EEEDFE',离散:'#FAECE7'};
const catFg={对称:'#0C447C',右偏:'#633806',有界:'#27500A',多峰:'#3C3489',离散:'#712B13'};
DS.forEach(d=>{
  const card=document.createElement('div');card.className='dcard';card.id='dc_'+d.id;
  card.innerHTML=`<div class="dcard-top"><div class="dcard-dot" style="background:${d.c}"></div><div class="dcard-name">${d.name}</div></div><canvas id="th_${d.id}" width="120" height="40" style="display:block;width:100%;height:40px"></canvas><span class="dcard-cat" style="background:${catBg[d.cat]||'#eee'};color:${catFg[d.cat]||'#444'}">${d.cat}</span>`;
  card.addEventListener('click',()=>pick(d.id));
  document.getElementById('cardGrid').appendChild(card);
});
requestAnimationFrame(()=>DS.forEach(d=>{const c=document.getElementById('th_'+d.id);if(c)drawThumb(c,d);}));

// ── 参数面板 & 图表 ───────────────────────────────────────────
let curId=null,curP={},chart=null;

function buildSliders(d){
  const area=document.getElementById('sliderArea');area.innerHTML='';curP={};
  d.params.forEach(pd=>{
    curP[pd.key]=pd.def;
    const row=document.createElement('div');row.className='slider-row';
    row.innerHTML=`<div class="slider-label"><span class="slider-name">${pd.name}</span><span class="slider-val" id="sv_${pd.key}">${pd.def}</span></div><input type="range" min="${pd.min}" max="${pd.max}" step="${pd.step}" value="${pd.def}" id="sl_${pd.key}">`;
    area.appendChild(row);
    const key=pd.key;
    row.querySelector('input').addEventListener('input',function(){
      curP[key]=parseFloat(this.value);
      document.getElementById('sv_'+key).textContent=this.value;
      redraw(d);
    });
  });
}

function updateStats(d){
  const row=document.getElementById('statRow');row.innerHTML='';
  try{d.stats(curP).forEach(s=>{const c=document.createElement('div');c.className='stat-chip';c.innerHTML=`${s.l}：<b>${s.v}</b>`;row.appendChild(c);});}catch(e){}
}

function redraw(d){
  updateStats(d);
  const[xLo,xHi,yMax]=d.axis;
  const pts=[];
  if(d.disc){
    for(let k=Math.floor(xLo);k<=Math.ceil(xHi);k++){
      const y=d.fn(k,curP);
      pts.push({x:k,y:(isFinite(y)&&y>=0)?y:0});
    }
  } else {
    const steps=300;
    for(let i=0;i<=steps;i++){
      const x=xLo+(xHi-xLo)*i/steps;
      const y=d.fn(x,curP);
      pts.push({x,y:(isFinite(y)&&y>=0)?y:0});
    }
  }
  const ctx=document.getElementById('mainChart').getContext('2d');
  if(chart){chart.destroy();chart=null;}
  const sx={type:'linear',min:xLo,max:xHi,grid:{display:false},ticks:{maxTicksLimit:9,font:{size:11}}};
  const sy={type:'linear',min:0,max:yMax,ticks:{font:{size:11}},grid:{color:'rgba(128,128,128,0.1)'}};
  if(d.disc){
    chart=new Chart(ctx,{type:'bar',data:{datasets:[{data:pts,backgroundColor:d.c+'99',borderColor:d.c,borderWidth:1.5,barPercentage:0.6}]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:80},plugins:{legend:{display:false}},scales:{x:{...sx,offset:false},y:sy}}});
  } else {
    chart=new Chart(ctx,{type:'line',data:{datasets:[{data:pts,borderColor:d.c,borderWidth:2.5,pointRadius:0,fill:true,backgroundColor:d.c+'22',tension:0.1}]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:60},plugins:{legend:{display:false}},scales:{x:sx,y:sy}}});
  }
}

function pick(id){
  if(curId)document.getElementById('dc_'+curId)?.classList.remove('sel');
  curId=id;document.getElementById('dc_'+id)?.classList.add('sel');
  const d=DS.find(x=>x.id===id);
  document.getElementById('pName').textContent=d.name;
  document.getElementById('pFormula').textContent=d.formula;
  document.getElementById('pNote').textContent=d.note;
  document.getElementById('axisInfo').textContent=`坐标轴固定：x ∈ [${d.axis[0]}, ${d.axis[1]}]，y ∈ [0, ${d.axis[2]}]`;
  buildSliders(d);redraw(d);
}

pick('norm');
</script>
