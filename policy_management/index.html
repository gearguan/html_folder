<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>策略管理 · 静止工况</title>
<style>
  :root {
    --bg: #eef1f8;
    --panel: #ffffff;
    --ink: #1f2430;
    --muted: #6b7280;
    --line: #e6e8ef;
    --head: #f4f6fb;
    --accent: #2f54eb;
    --green: #16a34a;
    --green-bg: #e7f6ec;
    --amber: #d97706;
    --red: #dc2626;
    --row-hover: #f7f9ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 600px at 50% -200px, #dfe6fb 0%, var(--bg) 60%);
    color: var(--ink);
    padding: 32px 16px 64px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: 26px;
    letter-spacing: 1px;
    margin: 8px 0 6px;
  }
  .note {
    color: var(--muted);
    font-size: 13px;
    padding: 0 4px 14px;
    line-height: 1.6;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(31, 36, 48, 0.06);
  }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  col.c-rank    { width: 5%; }
  col.c-date    { width: 9%; }
  col.c-score   { width: 10%; }
  col.c-total   { width: 10%; }
  col.c-note    { width: 22%; }
  col.c-video   { width: 8%; }
  col.c-file    { width: 10%; }
  thead th {
    background: var(--head);
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    padding: 12px 6px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    overflow: hidden;
  }
  thead th .arrow { color: var(--muted); font-size: 11px; margin-left: 2px; }
  tbody td {
    text-align: center;
    font-size: 13px;
    padding: 11px 6px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  tbody tr { position: relative; transition: background .15s; }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr:last-child td { border-bottom: none; }
  .rank {
    font-weight: 700;
    width: 64px;
    position: relative;
  }
  .rank::before {
    content: "";
    position: absolute;
    left: 0; top: 8px; bottom: 8px;
    width: 5px; border-radius: 3px;
    background: var(--accent);
  }
  .rank.top1::before { background: #f59e0b; }
  .rank.top2::before { background: #9ca3af; }
  .rank.top3::before { background: #cd7f32; }
  .name { font-weight: 600; letter-spacing: .5px; }
  .date-sub { display:block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .score { font-variant-numeric: tabular-nums; font-weight: 600; }
  .score.top5-mark {
    font-weight: 800;
    position: relative;
  }
  .score.top5-mark::after {
    content: "★";
    font-size: 9px;
    vertical-align: super;
    margin-left: 2px;
    opacity: 0.75;
  }
  .score.good { color: var(--green); }
  .score.mid  { color: var(--amber); }
  .score.low  { color: var(--red); }
  .dl {
    display: inline-flex; align-items: center; gap: 5px;
    text-decoration: none;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 13px;
    color: var(--ink);
    background: #fff;
    transition: all .15s;
  }
  .dl:hover { border-color: var(--accent); color: var(--accent); background: #f5f7ff; }
  .dl.cfg:hover { border-color: var(--green); color: var(--green); background: var(--green-bg); }
  .note-cell {
    text-align: left;
    color: var(--muted);
    white-space: normal;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .score a { color: inherit; text-decoration: none; border-bottom: 1px dashed currentColor; }
  .score a:hover { opacity: .75; }
  .foot { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; margin-top: 18px; position: relative; }
  .foot-hits { position: absolute; right: 0; line-height: 1; }

  /* 视频播放按钮 */
  .btn-play {
    display: inline-flex; align-items: center; gap: 4px;
    text-decoration: none;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 13px;
    color: var(--ink);
    background: #fff;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-play:hover { border-color: #7c3aed; color: #7c3aed; background: #f5f3ff; }

  /* 弹窗 */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.65);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    max-width: 92vw;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
    position: relative;
  }
  .modal-box video { display: block; max-width: 80vw; max-height: 70vh; border-radius: 8px; }
  .modal-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .modal-close {
    position: absolute; top: 12px; right: 14px;
    background: none; border: none; font-size: 22px;
    cursor: pointer; color: var(--muted); line-height: 1;
  }
  .modal-close:hover { color: var(--ink); }

  @media (max-width: 760px) {
    body { padding: 16px 6px 40px; }
    h1 { font-size: 20px; }
    thead th, tbody td { padding: 10px 4px; font-size: 12px; }
    .dl { padding: 4px 8px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>策略管理 · 静止工况</h1>
  <div class="note">
    各策略按综合表现排序（综合分 = 扶正 + 平衡 + 抗扰 的平均值，可点击表头按任意列排序）。
    点击右侧按钮下载对应的策略文件 (.pt) 与配置文件 (.yaml)。
  </div>

  <div class="card">
    <table id="board">
      <colgroup>
        <col class="c-rank">
        <col class="c-date">
        <col class="c-score">
        <col class="c-score">
        <col class="c-score">
        <col class="c-total">
        <col class="c-note">
        <col class="c-video">
        <col class="c-file">
        <col class="c-file">
      </colgroup>
      <thead>
        <tr>
          <th data-key="rank">排名</th>
          <th data-key="date">日期 <span class="arrow"></span></th>
          <th data-key="upright">扶正能力 <span class="arrow"></span></th>
          <th data-key="balance">平衡能力 <span class="arrow"></span></th>
          <th data-key="disturb">抗扰能力 <span class="arrow"></span></th>
          <th data-key="total">综合能力 <span class="arrow"></span></th>
          <th>说明</th>
          <th>视频</th>
          <th>策略文件</th>
          <th>配置文件</th>
        </tr>
      </thead>
      <tbody><!-- rows injected by JS --></tbody>
    </table>
  </div>

  <div class="foot">
    <span>数据由 strategies 数组维护 · 适用于 GitHub Pages 静态托管</span>
    <span class="foot-hits">
      <img src="https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=https%3A%2F%2Fgearguan.github.io%2Fhtml_folder%2Fpolicy_management&amp;count_bg=%236b7280&amp;title_bg=%23e6e8ef&amp;icon=&amp;icon_color=%236b7280&amp;title=%E4%BB%8A%E6%97%A5%2F%E7%B4%AF%E8%AE%A1&amp;edge_flat=true" alt="访客统计">
    </span>
  </div>
</div>

<!-- 视频弹窗 -->
<div class="modal-overlay" id="videoModal">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-title" id="modalTitle"></div>
    <video id="modalVideo" controls></video>
  </div>
</div>

<script src="strategies.js"></script>
<script>
/* 策略数据在 strategies.js 中维护，新增策略请编辑那个文件 */

// ---- 工具函数 ----
function avg(s) { return (s.upright + s.balance + s.disturb) / 3; }

function scoreClass(v) {
  if (v >= 70) return "good";
  if (v >= 45) return "mid";
  return "low";
}

let sortKey = "score";
let sortDesc = true;

function sortData() {
  const arr = [...strategies];
  arr.sort((a, b) => {
    let va, vb;
    if (sortKey === "score") { va = avg(a); vb = avg(b); }
    else if (sortKey === "total") { va = a.upright + a.balance + a.disturb; vb = b.upright + b.balance + b.disturb; }
    else if (sortKey === "date") { va = a.date; vb = b.date; }
    else { va = a[sortKey]; vb = b[sortKey]; }
    if (va < vb) return sortDesc ? 1 : -1;
    if (va > vb) return sortDesc ? -1 : 1;
    return 0;
  });
  return arr;
}

// 计算某列前 N 名的分数阈值（同分并列均标记）
function top5Threshold(key) {
  const vals = strategies
    .map(s => key === "total" ? s.upright + s.balance + s.disturb : s[key])
    .sort((a, b) => b - a);
  return vals[Math.min(5, vals.length) - 1];
}

function render() {
  const data = sortData();
  const thU = top5Threshold("upright");
  const thB = top5Threshold("balance");
  const thD = top5Threshold("disturb");
  const thT = top5Threshold("total");

  const tbody = document.querySelector("#board tbody");
  tbody.innerHTML = data.map((s, i) => {
    const rank = i + 1;
    const topCls = rank <= 3 ? ` top${rank}` : "";
    const total  = s.upright + s.balance + s.disturb;
    const mkU = s.upright >= thU ? " top5-mark" : "";
    const mkB = s.balance >= thB ? " top5-mark" : "";
    const mkD = s.disturb >= thD ? " top5-mark" : "";
    const mkT = total    >= thT ? " top5-mark" : "";
    return `
      <tr>
        <td class="rank${topCls}">${rank}</td>
        <td>
          <span class="name">${s.date}</span>
        </td>
        <td class="score ${scoreClass(s.upright)}${mkU}">${s.uprightUrl ? `<a href="${s.uprightUrl}" target="_blank">${s.upright.toFixed(6)}</a>` : s.upright.toFixed(6)}</td>
        <td class="score ${scoreClass(s.balance)}${mkB}">${s.balanceUrl ? `<a href="${s.balanceUrl}" target="_blank">${s.balance.toFixed(6)}</a>` : s.balance.toFixed(6)}</td>
        <td class="score ${scoreClass(s.disturb)}${mkD}">${s.disturbUrl ? `<a href="${s.disturbUrl}" target="_blank">${s.disturb.toFixed(6)}</a>` : s.disturb.toFixed(6)}</td>
        <td class="score ${scoreClass(total)}${mkT}">${total.toFixed(6)}</td>
        <td class="note-cell">${s.note || ""}</td>
        <td>${s.video ? `<button class="btn-play" onclick="openVideo('${s.video}','${s.date}')">▶ 播放</button>` : ""}</td>
        <td><a class="dl" href="${s.policy}" download>⬇ .pt</a></td>
        <td><a class="dl cfg" href="${s.config}" download>⬇ .yaml</a></td>
      </tr>`;
  }).join("");

  // 更新表头箭头
  document.querySelectorAll("thead th .arrow").forEach(el => el.textContent = "");
  const th = document.querySelector(`thead th[data-key="${sortKey}"] .arrow`);
  if (th) th.textContent = sortDesc ? "▼" : "▲";
}

// 表头点击排序
document.querySelectorAll("thead th[data-key]").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (key === "rank") { sortKey = "score"; sortDesc = true; }
    else if (sortKey === key) { sortDesc = !sortDesc; }
    else { sortKey = key; sortDesc = true; }
    render();
  });
});

render();

// ---- 视频弹窗 ----
const modal   = document.getElementById("videoModal");
const modalVideo = document.getElementById("modalVideo");
const modalTitle = document.getElementById("modalTitle");

function openVideo(src, title) {
  modalTitle.textContent = title + " · 演示视频";
  modalVideo.src = src;
  modalVideo.load();
  modal.classList.add("open");
}

function closeVideo() {
  modal.classList.remove("open");
  modalVideo.pause();
  modalVideo.src = "";
}

document.getElementById("modalClose").addEventListener("click", closeVideo);
modal.addEventListener("click", e => { if (e.target === modal) closeVideo(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeVideo(); });
</script>
</body>
</html>
