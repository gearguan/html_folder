
<style>
*{box-sizing:border-box;margin:0;padding:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.lbl{font-size:11px;color:var(--color-text-secondary);margin-bottom:4px}
.ctrl{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ctrl label{font-size:12px;color:var(--color-text-secondary);min-width:60px}
.ctrl span{font-size:13px;font-weight:500;min-width:36px;color:var(--color-text-primary)}
</style>

<div style="padding:1rem 0">

<div class="ctrl">
  <label>带宽 h</label>
  <input type="range" id="bw" min="0.1" max="3" step="0.05" value="0.8" style="flex:1">
  <span id="bw-out">0.80</span>
</div>

<div class="row">
  <div>
    <div class="lbl">每个数据点放一个核函数（高斯），h 控制宽度</div>
    <div style="position:relative;height:180px"><canvas id="c1" role="img" aria-label="每个数据点对应的核函数示意图"></canvas></div>
  </div>
  <div>
    <div class="lbl">所有核函数叠加 → KDE 曲线（橙色）</div>
    <div style="position:relative;height:180px"><canvas id="c2" role="img" aria-label="核函数叠加后的KDE曲线"></canvas></div>
  </div>
</div>

<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px">
  <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:8px 12px">
    <div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:2px">h 太小</div>
    <div style="font-size:12px;color:var(--color-text-primary)">曲线尖锐，保留噪声</div>
  </div>
  <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:8px 12px">
    <div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:2px">h 适中</div>
    <div style="font-size:12px;color:var(--color-text-primary)">平滑且保留真实形状</div>
  </div>
  <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:8px 12px">
    <div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:2px">h 太大</div>
    <div style="font-size:12px;color:var(--color-text-primary)">过度平滑，掩盖细节</div>
  </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const DATA = [-2.1, -1.4, -0.3, 0.2, 0.8, 1.5, 1.8, 3.2, 3.6];
const N = DATA.length;
const xs = Array.from({length:200}, (_,i) => -5 + i*0.05);

function gauss(x, mu, h){ return Math.exp(-0.5*((x-mu)/h)**2)/(h*Math.sqrt(2*Math.PI)); }

function kde(h){
  return xs.map(x => DATA.reduce((s,xi)=>s+gauss(x,xi,h),0)/N);
}

const COLORS_COMP = ['#378ADD','#1D9E75','#534AB7','#BA7517','#D4537E','#0F6E56','#639922','#993C1D','#D85A30'];

let ch1=null, ch2=null;

function draw(h){
  const kdeY = kde(h);

  // Chart 1: individual kernels
  const ds1 = DATA.map((xi,i)=>({
    label:'', type:'line',
    data: xs.map(x=>({x, y:gauss(x,xi,h)/N})),
    borderColor: COLORS_COMP[i%COLORS_COMP.length],
    borderWidth:1.2, pointRadius:0, fill:false, tension:0.3
  }));
  // add data points as scatter
  ds1.push({
    type:'scatter', label:'data',
    data: DATA.map(xi=>({x:xi, y:0})),
    backgroundColor:'#444', pointRadius:5, pointStyle:'triangle'
  });

  if(ch1){ ch1.destroy(); }
  ch1 = new Chart(document.getElementById('c1'),{
    type:'line', data:{datasets:ds1},
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:0},
      plugins:{legend:{display:false}},
      scales:{x:{type:'linear',min:-5,max:5,grid:{color:'rgba(128,128,128,0.1)'},ticks:{font:{size:9},maxTicksLimit:7}},
              y:{min:0,grid:{color:'rgba(128,128,128,0.1)'},ticks:{font:{size:9}}}}}
  });

  // Chart 2: KDE total
  if(ch2){ ch2.destroy(); }
  ch2 = new Chart(document.getElementById('c2'),{
    type:'line',
    data:{datasets:[
      {data:xs.map((x,i)=>({x,y:kdeY[i]})),
       borderColor:'#D85A30',borderWidth:2.5,pointRadius:0,
       fill:true,backgroundColor:'rgba(216,90,48,0.10)',tension:0.3},
      {type:'scatter',data:DATA.map(xi=>({x:xi,y:0})),
       backgroundColor:'#444',pointRadius:5,pointStyle:'triangle'}
    ]},
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:0},
      plugins:{legend:{display:false}},
      scales:{x:{type:'linear',min:-5,max:5,grid:{color:'rgba(128,128,128,0.1)'},ticks:{font:{size:9},maxTicksLimit:7}},
              y:{min:0,grid:{color:'rgba(128,128,128,0.1)'},ticks:{font:{size:9}}}}}
  });
}

document.getElementById('bw').addEventListener('input', function(){
  const h = parseFloat(this.value);
  document.getElementById('bw-out').textContent = h.toFixed(2);
  draw(h);
});

draw(0.8);
</script>
